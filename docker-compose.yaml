version: '3.8'

services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: always
    env_file: .env
    ports:
      - "3001:3000"
    volumes:
      - ./music:/app/music
      - ./users.json:/app/users.json
    logging:
      options:
        max-size: "10m"
        max-file: "3"
