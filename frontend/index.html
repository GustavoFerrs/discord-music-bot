<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8" />
  <title>Painel do Bot</title>
</head>

<body>
  <div class="container">
    <h1>🤖 Painel do Bot</h1>

    <form id="userForm">
      <div class="input-group">
        <input type="text" name="nome" placeholder="Nome do usuário" required />
      </div>

      <div class="input-group password-container">
        <input type="password" name="id" id="idInput" placeholder="ID do usuário" required />
        <button type="button" class="toggle-password" onclick="togglePassword()">
          <span id="toggleIcon">👁️</span>
        </button>
      </div>

      <div class="input-group">
        <input type="file" name="musica" accept="audio/*" required />
      </div>

      <button type="submit">Adicionar Usuário</button>
    </form>

    <h2>👥 Usuários Cadastrados</h2>
    <ul id="userList"></ul>
  </div>

  <script>
    function togglePassword() {
      const idInput = document.getElementById('idInput');
      const toggleIcon = document.getElementById('toggleIcon');

      if (idInput.type === 'password') {
        idInput.type = 'text';
        toggleIcon.textContent = '🙈';
      } else {
        idInput.type = 'password';
        toggleIcon.textContent = '👁️';
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch("/users");
        const users = await res.json();
        const list = document.getElementById("userList");

        if (users.length === 0) {
          list.innerHTML = '<li class="empty-state">Nenhum usuário cadastrado ainda</li>';
          return;
        }

        list.innerHTML = "";
        users.forEach(u => {
          const li = document.createElement("li");

          const userInfo = document.createElement("div");
          userInfo.className = "user-info";

          const idSpan = document.createElement("small");
          idSpan.textContent = "*****";
          idSpan.dataset.realId = u.id;


          const toggleBtn = document.createElement("button");
          toggleBtn.className = "toggle-id";
          toggleBtn.textContent = "👁️";
          toggleBtn.onclick = () => {
            if (idSpan.textContent === "*****") {
              idSpan.textContent = idSpan.dataset.realId;
              toggleBtn.textContent = "🙈";
            } else {
              idSpan.textContent = "*****";
              toggleBtn.textContent = "👁️";
            }
          };

          userInfo.innerHTML = `
        <strong>${u.nome}</strong><br>
        <small>Música: ${u.musica}</small>
      `;

          const idWrapper = document.createElement("div");
          idWrapper.innerHTML = "<small>ID: </small>";
          idWrapper.appendChild(idSpan);
          idWrapper.appendChild(toggleBtn);

          userInfo.appendChild(idWrapper);

          const btn = document.createElement("button");
          btn.className = "remove-btn";
          btn.textContent = "Remover";
          btn.onclick = async () => {
            if (confirm(`Tem certeza que deseja remover ${u.nome}?`)) {
              try {
                await fetch("/users/" + u.id, { method: "DELETE" });
                loadUsers();
              } catch (error) {
                alert("Erro ao remover usuário!");
              }
            }
          };

          li.appendChild(userInfo);
          li.appendChild(btn);
          list.appendChild(li);
        });
      } catch (error) {
        document.getElementById("userList").innerHTML =
          '<li class="empty-state">Erro ao carregar usuários</li>';
      }
    }

    document.getElementById("userForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      try {
        const res = await fetch("/users", { method: "POST", body: formData });
        const result = await res.json();

        if (!res.ok) {
          alert(result.error || "Erro ao adicionar usuário!");
          return;
        }

        e.target.reset();
        loadUsers();

        document.getElementById('idInput').type = 'password';
        document.getElementById('toggleIcon').textContent = '👁️';

      } catch (error) {
        alert("Erro de conexão ao adicionar usuário!");
      }
    });

    loadUsers();
  </script>
</body>

</html>
